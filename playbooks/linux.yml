---
- name: Configuration et administration complète de LINUX01
  hosts: linux
  become: true

  tasks:
    - name: 1. Gestion des groupes système et utilisateurs
      ansible.builtin.group:
        name: sysadmins
        state: present

    - name: Créer un utilisateur administrateur applicatif
      ansible.builtin.user:
        name: adminapp
        comment: "Administrateur Applicatif"
        group: sysadmins
        shell: /bin/bash
        create_home: true
        state: present

    - name: 2. Configuration des permissions sur un répertoire de travail
      ansible.builtin.file:
        path: /var/www/html/app
        state: directory
        owner: adminapp
        group: sysadmins
        mode: '0750'

    - name: 3. Installation et gestion du service applicatif (Nginx)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: S'assurer que Nginx est démarré et activé
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: 4. Gestion du stockage et point de montage de test
      ansible.builtin.file:
        path: /mnt/data
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 5. Installation et supervision (Node Exporter)
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Démarrer et activer node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: true

    - name: 6. Consultation et vérification des journaux système (Journald)
      ansible.builtin.shell: journalctl -u nginx --no-pager -n 20
      register: nginx_logs
      changed_when: false

    - name: Afficher un extrait des journaux Nginx
      ansible.builtin.debug:
        msg: "{{ nginx_logs.stdout_lines }}"
